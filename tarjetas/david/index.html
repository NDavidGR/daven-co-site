.save{display:block;margin:36px 0 12px;background:var(--accent);color:var(--on);text-decoration:none;font-weight:800;text-align:center;padding:17px;border-radius:8px;font-size:17px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.q{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:68px;background:var(--surface);color:var(--text);text-decoration:none;border-radius:8px;font-size:13px;font-weight:600}
.more{display:flex;gap:20px;margin-top:22px;justify-content:center;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);font:600 14px Archivo,sans-serif;padding:12px 4px;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.link[aria-expanded=true]{color:var(--text)}
.panel{display:none;background:var(--surface);border-radius:8px;padding:20px;margin-top:6px;text-align:center}
.panel.on{display:block}
.qr{background:var(--qrbg);border-radius:8px;padding:14px;width:240px;margin:0 auto 12px}
.qr svg{width:100%;height:auto;display:block}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);padding:12px 18px;min-height:44px;border-radius:8px;font:600 14px Archivo,sans-serif;cursor:pointer}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}

const STR={"save": {"es": "Guardar contacto", "en": "Save contact"}, "call": {"es": "Llamar", "en": "Call"}, "wa": {"es": "WhatsApp", "en": "WhatsApp"}, "mail": {"es": "Email", "en": "Email"}, "showqr": {"es": "Mostrar QR", "en": "Show QR"}, "share": {"es": "Compartir tarjeta", "en": "Share card"}, "copied": {"es": "Link copiado", "en": "Link copied"}, "sig_btn": {"es": "Guardar mi contacto", "en": "Save my contact"}, "scan": {"es": "Escanee para conectar", "en": "Scan to connect"}}, BI=false, URL_="https://co.daven.llc/tarjetas/david/", NAME="David Garz\u00f3n";
const $=s=>document.querySelector(s);
let lang="es";
if(BI){lang=(navigator.language||"es").slice(0,2)==="en"?"en":"es";try{lang=localStorage.getItem("lang")||lang}catch(e){}}
const L=k=>STR[k][lang];
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)};
function apply(){if(!BI)return;document.documentElement.lang=lang;
document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=STR[e.dataset.i18n][lang]);
document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=STR[e.dataset.i18nPh][lang]);
$("#lang").textContent=lang==="es"?"EN":"ES";$("#lang").setAttribute("aria-label",lang==="es"?"Switch to English":"Cambiar a español")}
if(BI){$("#lang").onclick=()=>{lang=lang==="es"?"en":"es";try{localStorage.setItem("lang",lang)}catch(e){};apply()}}
apply();
$("#bqr").onclick=()=>{const panel=$("#pqr"),btn=$("#bqr"),open=!panel.classList.contains("on");
panel.classList.toggle("on",open);btn.setAttribute("aria-expanded",open);
if(open)panel.scrollIntoView({behavior:"smooth",block:"nearest"})};
$("#share").onclick=async()=>{if(navigator.share){try{await navigator.share({title:NAME,url:URL_})}catch(e){}}else{try{await navigator.clipboard.writeText(URL_);toast(L("copied"))}catch(e){prompt("Link",URL_)}}};
